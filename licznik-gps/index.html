<!doctype html>
<html lang="pl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1220"><title>Licznik GPS</title>
<style>*{box-sizing:border-box}body{margin:0;background:#0b1220;color:#fff;font-family:Arial,sans-serif}.wrap{max-width:520px;margin:auto;padding:16px}.card{background:#151f32;border-radius:22px;padding:20px;margin-bottom:14px}h1{margin:4px 0 18px}.km{font-size:64px;font-weight:800;text-align:center}.unit{text-align:center;color:#aeb9cc}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}.stat{background:#202b40;border-radius:15px;padding:14px}.label{font-size:13px;color:#aeb9cc}.value{font-size:24px;font-weight:700;margin-top:5px}button{width:100%;padding:17px;border:0;border-radius:15px;font-size:18px;font-weight:700;margin-top:10px;background:#28c76f}button.stop{background:#ef5350;color:white}button.secondary{background:#34435e;color:#fff}#status{text-align:center;color:#b9c4d6;font-size:14px;margin-top:12px;line-height:1.4}.warn{background:#4a3010;color:#ffd98a;padding:12px;border-radius:12px;margin-bottom:14px;font-size:14px;display:none}.trip{padding:12px 0;border-bottom:1px solid #2b3850}</style></head>
<body><div class="wrap"><h1>🚗 Licznik GPS</h1><div id="secureWarn" class="warn">⚠️ Ta strona wymaga dostępu do lokalizacji. Zezwól Chrome na lokalizację.</div>
<div class="card"><div class="unit">PRZEJECHANE</div><div id="km" class="km">0.00</div><div class="unit">km</div><div class="grid">
<div class="stat"><div class="label">Aktualna prędkość</div><div class="value"><span id="speed">0</span> km/h</div></div><div class="stat"><div class="label">Czas</div><div class="value" id="time">00:00:00</div></div><div class="stat"><div class="label">Średnia</div><div class="value"><span id="avg">0</span> km/h</div></div><div class="stat"><div class="label">Dokładność GPS</div><div class="value"><span id="acc">—</span> m</div></div></div>
<button id="start">▶ START</button><button id="stop" class="stop" disabled>■ STOP</button><button id="reset" class="secondary">↺ Wyzeruj</button><div id="status">Naciśnij START i zezwól Chrome na lokalizację.</div></div>
<div class="card"><h2>📋 Historia</h2><div id="history"></div><button class="secondary" id="clear">Wyczyść historię</button></div></div>
<script>
let watch=null,last=null,total=0,startAt=0,timer=null,active=false,started=false;
const $=id=>document.getElementById(id),km=$('km'),speed=$('speed'),time=$('time'),avg=$('avg'),acc=$('acc'),status=$('status');
function hav(a,b){const R=6371000,p=Math.PI/180,dLat=(b.lat-a.lat)*p,dLon=(b.lon-a.lon)*p,q=Math.sin(dLat/2)**2+Math.cos(a.lat*p)*Math.cos(b.lat*p)*Math.sin(dLon/2)**2;return 2*R*Math.asin(Math.sqrt(q))}
function fmt(s){s=Math.max(0,Math.floor(s));return [Math.floor(s/3600),Math.floor(s/60)%60,s%60].map(x=>String(x).padStart(2,'0')).join(':')}
function start(){if(!navigator.geolocation){status.textContent='❌ GPS niedostępny';return}active=true;started=false;last=null;total=0;startAt=Date.now();$('start').disabled=true;$('stop').disabled=false;status.textContent='📍 Czekam na GPS…';watch=navigator.geolocation.watchPosition(pos=>{const p={lat:pos.coords.latitude,lon:pos.coords.longitude,t:pos.timestamp};const a=pos.coords.accuracy||999;acc.textContent=Math.round(a);if(!started){started=true;startAt=Date.now();status.textContent='✅ GPS działa. Jedź!'}if(last){const d=hav(last,p),dt=(p.t-last.t)/1000;if(a<=100&&d<=300&&dt>0){total+=d;km.textContent=(total/1000).toFixed(2);let v=pos.coords.speed;if(v==null||!isFinite(v))v=d/dt;speed.textContent=Math.round(v*3.6)}}else{let v=pos.coords.speed;speed.textContent=v!=null&&isFinite(v)?Math.round(v*3.6):0}last=p},e=>status.textContent='❌ GPS: '+({1:'brak zgody',2:'GPS niedostępny',3:'timeout'}[e.code]||e.message),{enableHighAccuracy:true,maximumAge:0,timeout:15000});}
function stop(){if(!active)return;navigator.geolocation.clearWatch(watch);active=false;$('start').disabled=false;$('stop').disabled=true;const s=(Date.now()-startAt)/1000,k=total/1000;if(k>0){let a=JSON.parse(localStorage.getItem('trasy')||'[]');a.unshift({date:new Date().toLocaleString('pl-PL'),km:k.toFixed(2),time:fmt(s)});localStorage.setItem('trasy',JSON.stringify(a.slice(0,50)))}status.textContent='⏹️ Zatrzymano. Przejazd zapisany.';renderHistory()}
function reset(){total=0;last=null;time.textContent='00:00:00';speed.textContent='0';avg.textContent='0';acc.textContent='—';km.textContent='0.00'}
function renderHistory(){const a=JSON.parse(localStorage.getItem('trasy')||'[]');$('history').innerHTML=a.length?a.map(x=>'<div class="trip"><b>'+x.km+' km</b> • '+x.time+'<br><small>'+x.date+'</small></div>').join(''):'<span style="color:#aeb9cc">Brak przejazdów.</span>'}
timer=setInterval(()=>{if(active&&started){const s=(Date.now()-startAt)/1000;time.textContent=fmt(s);avg.textContent=s>0?(total/1000/(s/3600)).toFixed(1):'0'}},500);
$('start').onclick=start;$('stop').onclick=stop;$('reset').onclick=reset;$('clear').onclick=()=>{localStorage.removeItem('trasy');renderHistory()};renderHistory();
</script></body></html>
